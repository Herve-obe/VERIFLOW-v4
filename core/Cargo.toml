[package]
name = "veriflow-core"
description = "Cœur métier de VERIFLOW (sans interface)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cpal = "0.18"
ebur128 = "0.1"
rtrb = "0.4"
rubato = "5"
# SYNC : corrélation des formes d'onde par FFT (MIT ou Apache 2.0).
realfft = "3.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
quick-xml = "0.38"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
md-5 = "0.10"
filetime = "0.2"
gethostname = "1"
pdf-writer = "0.14"
fs4 = "1"
walkdir = "2"
sha1 = "0.10"
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }
thiserror = "2"
# REPORT : mise en page PDF par Typst embarqué (Apache 2.0), classeurs Excel.
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
rust_xlsxwriter = "0.99"

[dev-dependencies]
tempfile = "3"

# ASIO (Windows) : le SDK Steinberg, sous licence GPLv3 depuis octobre 2025
# (charte §6.3), est téléchargé par asio-sys à la compilation ; LLVM requis.
[target.'cfg(windows)'.dependencies]
cpal = { version = "0.18", features = ["asio"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
