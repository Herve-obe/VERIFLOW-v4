# Compilation des installeurs Windows, macOS et Linux.
# Déclenchée sur les tags v* (publie une Release brouillon) ou manuellement.
# FFmpeg (GPLv3) : builds BtbN pour Windows et Linux, compilé ici pour macOS ;
# son code source complet est joint à chaque Release (job « sources »).
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sources:
        description: "Assembler aussi l'archive des sources de FFmpeg (artefact)"
        type: boolean
        default: false

jobs:
  # FFmpeg macOS compilé par VERIFLOW, une fois par architecture, gardé en
  # cache tant que le script (sources et options épinglées) ne change pas.
  ffmpeg-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache FFmpeg macOS
        id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-macos
          key: ffmpeg-macos-${{ matrix.arch }}-${{ hashFiles('scripts/build-ffmpeg-macos.sh') }}

      - name: Outils de compilation
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install nasm meson ninja cmake pkg-config autoconf automake libtool subversion

      - name: Compiler FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-macos.sh build ffmpeg-macos

      - name: Contrôler FFmpeg
        run: |
          ./ffmpeg-macos/ffmpeg -hide_banner -version | head -1
          otool -L ffmpeg-macos/ffmpeg
          head -3 ffmpeg-macos/BUILDINFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-${{ matrix.arch }}
          path: ffmpeg-macos

  build:
    needs: ffmpeg-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Installer les dépendances JS
        run: npm ci

      # FFmpeg intégré à l'installeur : VERIFLOW fonctionne sans Internet ni installation annexe.
      # Binaires FFmpeg gardés en cache : les sources (evermeet.cx en
      # particulier) ne répondent pas toujours. La clé suit le script, qui
      # épingle versions et empreintes : un changement force un nouveau
      # téléchargement vérifié.
      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/fetch-ffmpeg.sh', 'scripts/build-ffmpeg-macos.sh') }}

      - name: FFmpeg macOS (Apple Silicon)
        if: matrix.platform == 'macos-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-macos-arm64
          path: ffmpeg-macos/arm64

      - name: FFmpeg macOS (Intel)
        if: matrix.platform == 'macos-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-macos-x86_64
          path: ffmpeg-macos/x86_64

      - name: Télécharger et vérifier FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          FFMPEG_MACOS_DIR: ${{ github.workspace }}/ffmpeg-macos
        run: bash scripts/fetch-ffmpeg.sh ${{ matrix.target }}

      - name: Contrôler FFmpeg
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          src-tauri/binaries/veriflow-ffmpeg-${{ matrix.target }}$ext -hide_banner -version | head -1
          src-tauri/binaries/veriflow-ffprobe-${{ matrix.target }}$ext -hide_banner -version | head -1
          # Licence : un FFmpeg compilé avec --enable-nonfree n'est pas redistribuable.
          if src-tauri/binaries/veriflow-ffmpeg-${{ matrix.target }}$ext -hide_banner -buildconf | grep -q -- --enable-nonfree; then
            echo "ERREUR : FFmpeg compilé avec --enable-nonfree, non redistribuable" >&2
            exit 1
          fi

      # Licences des crates Rust et paquets JavaScript compilés (textes
      # embarqués, Aide > Licences) ; échoue sur une licence incompatible.
      - name: Avis de licences des composants tiers
        shell: bash
        run: node scripts/third-party.mjs ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.target }}

      - name: Compiler et empaqueter
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }} --config src-tauri/tauri.ffmpeg.conf.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "VERIFLOW ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: true

      - name: Conserver les installeurs (lancement manuel)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: veriflow-${{ matrix.platform }}
          # Uniquement les installeurs (pas les dossiers de travail du bundler).
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  # Code source correspondant des FFmpeg livrés (GPLv3 §6 d) : joint à la
  # Release, au même endroit que les installeurs. Lancement manuel : artefact.
  sources:
    if: startsWith(github.ref, 'refs/tags/') || inputs.sources
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Place disque
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Outils
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Assembler les sources
        run: bash scripts/ffmpeg-sources.sh sources-out

      - name: Joindre à la Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" sources-out/* --clobber --repo "${{ github.repository }}"

      - name: Conserver les sources (lancement manuel)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-sources
          path: sources-out
