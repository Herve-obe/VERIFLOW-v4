[package]
name = "veriflow"
description = "VERIFLOW : gestion des rushes audio et vidéo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "veriflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
veriflow-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
notify = "8"
tokio = { version = "1", features = ["sync"] }

# macOS : recalage de la vue web au redimensionnement (voir src/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "objc2"] }
